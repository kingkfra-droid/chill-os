name: Build ChillOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build ChillOS
        working-directory: android/ChillOS
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/ChillOS/app/build/outputs/apk/debug/app-debug.apk \
             release/ChillOS-debug.apk

      - name: SHA256
        run: |
          sha256sum release/ChillOS-debug.apk \
            > release/ChillOS-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChillOS-debug
          path: release/
