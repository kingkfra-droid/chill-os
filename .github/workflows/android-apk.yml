name: Build and Release ChillOS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/ChillOS

    steps:
      - name: Checkout ChillOS
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"
        working-directory: .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build ChillOS APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/ChillOS-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "ChillOS Build ${{ github.run_number }}"
          body: |
            ## ChillOS APK

            Automatic build from commit:
            `${{ github.sha }}`

            This is an automatically generated debug APK.
          files: android/ChillOS/release/ChillOS-debug.apk
          generate_release_notes: true
