name: ChillOS Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ChillOS
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build ChillOS APK
        working-directory: android/ChillOS
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp android/ChillOS/app/build/outputs/apk/debug/app-debug.apk \
            "ChillOS-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "ChillOS-${{ github.ref_name }}"
          path: "ChillOS-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "ChillOS ${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: "ChillOS-${{ github.ref_name }}.apk"
